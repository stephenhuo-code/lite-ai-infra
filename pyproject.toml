[project]
name = "lite-ai-infra"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.32", "pyjwt[crypto]>=2.9",
  "boto3>=1.35", "httpx>=0.27",
  # data-pipeline 运行时依赖:worker→run_prepare 直接 import(lance 写 / yaml 生成 DJ recipe)。
  # 必须是运行时依赖(非 dev),否则精简装的生产环境 data-pipeline worker 会 ImportError(dev/prod parity)。
  "pylance>=0.18", "pyyaml>=6",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "import-linter>=2.1", "datamodel-code-generator>=0.26"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: 需要本地 MinIO/Keycloak（docker-compose）的集成测试；默认不跑"]
addopts = "-m 'not integration'"
