name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run lint-imports
      - run: bash scripts/ci_guards.sh
      - name: contract breaking-change check
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with: {base: 'contracts/openapi/identity-org.yaml@HEAD~1', revision: 'contracts/openapi/identity-org.yaml'}
        continue-on-error: true
      - run: make gen && git diff --exit-code libs/contracts_gen/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: docker compose -f deploy/dev/docker-compose.yml up -d
      - name: wait for Keycloak realm + MinIO (fail fast, no silent skip; 120s for KC-on-Postgres cold start)
        run: |
          # 120s window covers KC-on-Postgres cold start (pull postgres:16-alpine → PG init → KC waits PG healthy → realm import)
          for i in $(seq 1 120); do
            curl -fsS http://localhost:8080/realms/lite-ai/.well-known/openid-configuration >/dev/null 2>&1 \
              && curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 \
              && echo "deps ready after ${i}s" && exit 0
            sleep 1
          done
          echo "deps not ready in 120s" >&2; exit 1
      - run: make test-integration
