# 自构建 omnigent server/host 镜像推我们 registry(plan 9-prod / ADR-026 §1)。
# 触发:vendored submodule ref 变更 / patch 变更 / 手动。
name: omnigent-image
on:
  push:
    paths:
      - "third_party/omnigent"
      - "deploy/omnigent-patches/**"
      - "scripts/omnigent_build.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag(默认 sha-<short>)"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive            # 拉 vendored omnigent
      - uses: docker/setup-buildx-action@v3
      - name: Login to our registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.OMNIGENT_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build & push
        env:
          OMNIGENT_REGISTRY: ${{ vars.OMNIGENT_REGISTRY }}
          OMNIGENT_TAG: ${{ github.event.inputs.tag || format('sha-{0}', github.sha) }}
        run: bash scripts/omnigent_build.sh
