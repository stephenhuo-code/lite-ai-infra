# deploy/dev/gravitino.yml —— dev Gravitino(fileset catalog → dev MinIO)
# 端口:Gravitino server 容器内 8090 → 宿主 8091(避让 gateway 8090)
services:
  gravitino:
    image: apache/gravitino:1.1.0          # Task 1 验证;不可用则换最新 tag 并记 RESULTS
    ports: ["8091:8090"]
    environment:
      GRAVITINO_MEMORY: "-Xms512m -Xmx1g"
    volumes:
      - gravitino-data:/root/gravitino/data   # H2 entity store(fileset catalog 元数据持久化,探针 P-1)
    networks: [dev_default]
networks:
  dev_default:
    external: true
    name: dev_default
volumes:
  gravitino-data:
