# omnigent 自托管(Plan 9)。header-auth(身份来自可信代理头),独立 postgres + /data 卷。
# 「不直达」固化(Task 1):本仓库 dev 里服务跑在主机(uv),仅 deps 在 docker → omnigent 绑
# 127.0.0.1(仅本机/主机 BFF 可达,不对外暴露);prod(容器化 BFF)改为内部网络 + 不发布端口。
# 实测可用镜像 digest(Task0):sha256:112be2e5f8d1eae47edbd3892243a47bfde2b3a462f0a6a595f15ac4207aed1b
# 镜像策略分阶段(ADR-026 §1):探针/dev 用上游预构建;采用后自构建到我们 registry(9-prod)。
name: liteai-omnigent

services:
  omnigent-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnigent
      POSTGRES_USER: omnigent
      POSTGRES_PASSWORD: probe-pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnigent -d omnigent"]
      interval: 3s
      timeout: 3s
      retries: 30

  omnigent:
    image: ${OMNIGENT_IMAGE:-ghcr.io/omnigent-ai/omnigent-server}:${OMNIGENT_IMAGE_TAG:-latest}
    depends_on:
      omnigent-pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://omnigent:probe-pw@omnigent-pg:5432/omnigent
      ARTIFACT_DIR: /data/artifacts
      HOST: 0.0.0.0
      PORT: "8000"
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      OMNIGENT_AUTH_ENABLED: "1"
      OMNIGENT_AUTH_PROVIDER: header
      OMNIGENT_AUTH_HEADER: X-Forwarded-Email
    volumes:
      - omnigent-data:/data
    ports:
      - "127.0.0.1:8900:8000"   # 仅本机可达(主机 BFF);不对外。prod 容器化时改内部网络。

volumes:
  omnigent-data:
