# omnigent 自托管(Plan 9)。header-auth(身份来自可信代理头),独立 postgres + /data 卷。
# 「不直达」固化(Task 1):本仓库 dev 里服务跑在主机(uv),仅 deps 在 docker → omnigent 绑
# 127.0.0.1(仅本机/主机 BFF 可达,不对外暴露);prod(容器化 BFF)改为内部网络 + 不发布端口。
# 镜像 = 本地自构建(ADR-026 §1 修订:单一源自构建,dev/prod 同源)。
# 起前先:`scripts/omnigent_build.sh dev`(从 third_party/omnigent 钉定 ref + patch-queue 本地 build
# 出 omnigent-server:dev / omnigent-host:dev)。prod 走 CI build+push registry,prod pull(same bits)。
# omnigent 源码钉 ref(Task0 实测):38523a1。
name: liteai-omnigent

services:
  omnigent-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnigent
      POSTGRES_USER: omnigent
      POSTGRES_PASSWORD: probe-pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnigent -d omnigent"]
      interval: 3s
      timeout: 3s
      retries: 30

  omnigent:
    # 本地自构建镜像(scripts/omnigent_build.sh dev);不再默认拉上游(ADR-026 §1:dev 同源自构建)。
    image: ${OMNIGENT_IMAGE:-omnigent-server}:${OMNIGENT_IMAGE_TAG:-dev}
    depends_on:
      omnigent-pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://omnigent:probe-pw@omnigent-pg:5432/omnigent
      ARTIFACT_DIR: /data/artifacts
      HOST: 0.0.0.0
      PORT: "8000"
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      # dev 单用户模式:本地 `omnigent host` CLI 无法对 header 模式做回拨认证(401,需代理注入头=prod)。
      # 单用户下 host 可连、runner 注册。我们的数据控制链路(MCP 令牌+can())独立于 omnigent 身份,
      # 单用户下照常成立(BFF 仍注入 X-Forwarded-Email,omnigent 忽略)。**prod = header 模式(代理后)**。
      OMNIGENT_AUTH_ENABLED: "0"
    volumes:
      - omnigent-data:/data
    ports:
      - "127.0.0.1:8900:8000"   # 仅本机可达(主机 BFF);不对外。prod 容器化时改内部网络。

volumes:
  omnigent-data:
