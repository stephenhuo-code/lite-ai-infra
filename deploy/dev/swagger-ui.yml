# deploy/dev/swagger-ui.yml —— Swagger L1:渲染全部契约(不依赖起任何服务)
# 跑:make api-docs → http://localhost:8088
services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports: ["8088:8080"]
    environment:
      # URLS 由 `make api-docs` 经 scripts/swagger_urls.py 自动从 contracts/openapi/ 生成
      # (新增契约丢进目录即自动出现在下拉,无需改这里)。默认值兜底单契约。
      URLS: "${URLS:-[{url: '/contracts/identity-org.yaml', name: 'identity-org'}]}"
    volumes:
      - ../../contracts/openapi:/usr/share/nginx/html/contracts:ro
