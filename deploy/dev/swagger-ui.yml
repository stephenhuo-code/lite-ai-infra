# deploy/dev/swagger-ui.yml —— Swagger L1:渲染全部契约(不依赖起任何服务)
# 跑:make api-docs → http://localhost:8088
services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports: ["8088:8080"]
    environment:
      # 新增契约时在此加一行(Plan 4/5 各自补 metadata / data-pipeline)
      URLS: "[{url: '/contracts/identity-org.yaml', name: 'identity-org'}]"
      URLS_PRIMARY_NAME: "identity-org"
    volumes:
      - ../../contracts/openapi:/usr/share/nginx/html/contracts:ro
